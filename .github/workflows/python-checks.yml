name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py signal_engine.py db_store.py model_engine.py player_props.py background_collector.py decision_engine.py backtest_engine.py advanced_features.py readiness_center.py market_engine.py team_model.py
