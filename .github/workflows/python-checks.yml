name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py signal_engine.py db_store.py model_engine.py player_props.py background_collector.py decision_engine.py backtest_engine.py advanced_features.py readiness_center.py market_engine.py team_model.py prediction_tracking.py
      - name: Smoke test Streamlit startup
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/streamlit.log
            echo "::error::Streamlit did not become healthy within 60 seconds."
            exit 1
          fi
          echo "Streamlit health endpoint responded successfully."
